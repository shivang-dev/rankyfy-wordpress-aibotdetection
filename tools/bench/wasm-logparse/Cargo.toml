[package]
name = "wasm-logparse"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
